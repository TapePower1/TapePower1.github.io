<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Общий чат | ПК ↔ Телефон</title>
  <style>
    /* Стили полностью сохранены из предыдущей версии */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px;
    }
    .chat-container {
      width: 100%; max-width: 700px; height: 90vh;
      background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-radius: 24px; border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 25px 60px rgba(0,0,0,0.4); display: flex; flex-direction: column; overflow: hidden;
    }
    .chat-header {
      padding: 20px 24px; background: rgba(255,255,255,0.03);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
    }
    .chat-header h1 { color: #e0e0ff; font-size: 1.6rem; font-weight: 600; display: flex; align-items: center; gap: 10px; }
    .chat-header h1::before { content: "💬"; font-size: 1.8rem; }
    .user-badge { display: flex; align-items: center; gap: 8px; background: rgba(100,150,255,0.2); border-radius: 30px; padding: 6px 16px; }
    .online-dot { width: 10px; height: 10px; background: #4ade80; border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{ box-shadow: 0 0 8px #4ade80; } 50%{ box-shadow: 0 0 20px #4ade80; } }
    .user-badge span { color: #c0d0ff; font-weight: 500; }
    .status-text { color: #a0b0cc; font-size: 0.8rem; background: rgba(255,255,255,0.05); padding: 4px 12px; border-radius: 20px; }
    .messages-area {
      flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 12px;
    }
    .messages-area::-webkit-scrollbar { width: 6px; }
    .messages-area::-webkit-scrollbar-track { background: transparent; }
    .messages-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    .message { display: flex; flex-direction: column; max-width: 80%; animation: fadeInUp 0.3s ease-out; word-break: break-word; }
    .message.own { align-self: flex-end; }
    .message.other { align-self: flex-start; }
    .message.system { align-self: center; max-width: 90%; }
    @keyframes fadeInUp { from{ opacity: 0; transform: translateY(15px); } to{ opacity: 1; transform: translateY(0); } }
    .message .bubble { padding: 12px 16px; border-radius: 18px; font-size: 0.95rem; line-height: 1.4; color: #f0f0ff; }
    .message.own .bubble { background: linear-gradient(135deg, #4f6ef6, #3b5de7); border-bottom-right-radius: 4px; }
    .message.other .bubble { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-bottom-left-radius: 4px; }
    .message.system .bubble { background: rgba(255,200,100,0.15); border: 1px solid rgba(255,200,100,0.3); text-align: center; font-style: italic; color: #ffd78b; font-size: 0.85rem; border-radius: 20px; padding: 8px 18px; }
    .message .meta { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; padding: 0 8px; font-size: 0.75rem; color: #a0b0cc; }
    .message.own .meta { justify-content: flex-end; }
    .message .sender-name { font-weight: 600; color: #c8d6ff; }
    .message .time { opacity: 0.7; font-size: 0.7rem; }
    .input-area { padding: 16px 24px; background: rgba(255,255,255,0.03); border-top: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; gap: 10px; }
    .name-row { display: flex; gap: 8px; align-items: center; }
    .name-row input, .message-row input {
      flex: 1; padding: 10px 16px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.2);
      border-radius: 25px; color: #e0e0ff; font-size: 0.9rem; outline: none;
    }
    .name-row input:focus, .message-row input:focus { border-color: #4f6ef6; }
    .save-name-btn, .send-btn { cursor: pointer; transition: all 0.3s; }
    .save-name-btn { padding: 10px 18px; background: rgba(100,150,255,0.25); border: 1px solid rgba(100,150,255,0.4); border-radius: 25px; color: #c0d0ff; }
    .send-btn {
      width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #4f6ef6, #3b5de7);
      border: none; color: white; font-size: 1.3rem; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 20px rgba(79,110,246,0.4); flex-shrink: 0;
    }
    .send-btn:hover { transform: scale(1.05); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>
<div class="chat-container">
  <div class="chat-header">
    <h1>Общий чат</h1>
    <div style="display: flex; align-items: center; gap: 12px;">
      <div class="user-badge">
        <div class="online-dot"></div>
        <span id="currentUserNameDisplay">Гость</span>
      </div>
      <div class="status-text" id="connectionStatus">🔌 Подключение...</div>
    </div>
  </div>

  <div class="messages-area" id="messagesArea">
    <div class="empty-chat">✨ Подключаемся к серверу...</div>
  </div>

  <div class="input-area">
    <div class="name-row">
      <input type="text" id="nameInput" placeholder="Ваше имя..." maxlength="25" autocomplete="off">
      <button class="save-name-btn" id="saveNameBtn">💾 Сохранить</button>
    </div>
    <div class="message-row">
      <input type="text" id="messageInput" placeholder="Сообщение..." maxlength="500" autocomplete="off">
      <button class="send-btn" id="sendBtn">➤</button>
    </div>
  </div>
</div>

<script>
  (function() {
    // ---------- Конфигурация WebSocket ----------
    const WS_URL = `ws://${window.location.hostname}:8080`; // сервер на том же хосте, порт 8080

    // ---------- DOM элементы ----------
    const messagesArea = document.getElementById('messagesArea');
    const nameInput = document.getElementById('nameInput');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const saveNameBtn = document.getElementById('saveNameBtn');
    const currentUserNameDisplay = document.getElementById('currentUserNameDisplay');
    const connectionStatus = document.getElementById('connectionStatus');

    // ---------- Состояние ----------
    let currentUserName = localStorage.getItem('globalChatName') || 'Гость';
    let messages = [];
    let ws = null;
    let messageCounter = 0;

    // ---------- Функции для сообщений ----------
    function generateId() {
      return 'msg_' + Date.now() + '_' + (messageCounter++) + '_' + Math.random().toString(36).substr(2, 5);
    }

    function formatTime(ts) {
      const d = new Date(ts);
      return `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
    }

    function isOwn(sender) { return sender === currentUserName; }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
    }

    function addMessage(msg) {
      messages.push(msg);
      if (messages.length > 150) messages = messages.slice(-150);
    }

    function render() {
      if (messages.length === 0) {
        messagesArea.innerHTML = '<div class="empty-chat">💭 Пока нет сообщений</div>';
        return;
      }
      let html = '';
      messages.forEach(msg => {
        const own = isOwn(msg.sender);
        const cls = msg.type === 'system' ? 'system' : (own ? 'own' : 'other');
        html += `<div class="message ${cls}">`;
        if (msg.type !== 'system') {
          html += `<div class="meta"><span class="sender-name">${escapeHtml(msg.sender)}</span><span class="time">${formatTime(msg.timestamp)}</span></div>`;
        }
        html += `<div class="bubble">${escapeHtml(msg.text)}</div>`;
        if (msg.type === 'system') {
          html += `<div class="meta" style="justify-content:center;"><span class="time">${formatTime(msg.timestamp)}</span></div>`;
        }
        html += `</div>`;
      });
      messagesArea.innerHTML = html;
    }

    function scrollBottom() {
      requestAnimationFrame(() => { messagesArea.scrollTop = messagesArea.scrollHeight; });
    }

    // ---------- Работа с WebSocket ----------
    function connect() {
      connectionStatus.textContent = '🔌 Подключение...';
      ws = new WebSocket(WS_URL);

      ws.onopen = () => {
        connectionStatus.textContent = '🟢 Онлайн (все устройства)';
        connectionStatus.style.color = '#4ade80';
        // При подключении отправляем системное сообщение о входе (только себе)
        const joinMsg = {
          id: generateId(),
          sender: 'Система',
          text: `${escapeHtml(currentUserName)} присоединился к чату`,
          timestamp: Date.now(),
          type: 'system'
        };
        // Не шлём на сервер, добавляем локально для красоты
        addMessage(joinMsg);
        render();
        scrollBottom();
      };

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          // Игнорируем дубликаты по id
          if (!messages.some(m => m.id === msg.id)) {
            addMessage(msg);
            render();
            scrollBottom();
          }
        } catch (e) {
          console.warn('Ошибка парсинга сообщения:', e);
        }
      };

      ws.onerror = () => {
        connectionStatus.textContent = '⚠️ Ошибка соединения';
        connectionStatus.style.color = '#ffaa66';
      };

      ws.onclose = () => {
        connectionStatus.textContent = '⛔ Соединение закрыто. Переподключение...';
        connectionStatus.style.color = '#ff6666';
        // Автопереподключение через 3 секунды
        setTimeout(connect, 3000);
      };
    }

    // ---------- Отправка сообщения ----------
    function sendMessage() {
      const text = messageInput.value.trim();
      if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
      if (!currentUserName || currentUserName === 'Гость') {
        alert('Пожалуйста, укажите имя перед отправкой.');
        return;
      }

      const msg = {
        id: generateId(),
        sender: currentUserName,
        text: text,
        timestamp: Date.now(),
        type: 'user'
      };

      // Отправляем на сервер (сервер разошлёт всем)
      ws.send(JSON.stringify(msg));
      messageInput.value = '';
      messageInput.focus();
    }

    // ---------- Сохранение имени ----------
    function saveName() {
      let newName = nameInput.value.trim();
      if (!newName) { alert('Имя не может быть пустым.'); return; }
      if (newName.length > 25) newName = newName.substring(0, 25);

      const oldName = currentUserName;
      currentUserName = newName;
      localStorage.setItem('globalChatName', currentUserName);
      currentUserNameDisplay.textContent = currentUserName;
      nameInput.value = currentUserName;

      if (oldName !== currentUserName && oldName !== 'Гость') {
        const renameMsg = {
          id: generateId(),
          sender: 'Система',
          text: `${escapeHtml(oldName)} сменил имя на ${escapeHtml(currentUserName)}`,
          timestamp: Date.now(),
          type: 'system'
        };
        // Отправляем системное сообщение всем через сервер
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify(renameMsg));
        }
        addMessage(renameMsg);
        render();
        scrollBottom();
      }
    }

    // ---------- Обработчики событий ----------
    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') { e.preventDefault(); sendMessage(); } });
    saveNameBtn.addEventListener('click', saveName);
    nameInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') { e.preventDefault(); saveName(); } });

    // ---------- Инициализация ----------
    currentUserName = localStorage.getItem('globalChatName') || 'Гость';
    currentUserNameDisplay.textContent = currentUserName;
    nameInput.value = currentUserName === 'Гость' ? '' : currentUserName;

    connect(); // Запускаем подключение

    messageInput.focus();
  })();
</script>
</body>
</html>
