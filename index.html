<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Общий чат | Все видят все сообщения</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .chat-container {
            width: 100%;
            max-width: 700px;
            height: 90vh;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4), 0 0 40px rgba(100, 150, 255, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 20px 24px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .chat-header h1 {
            color: #e0e0ff;
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-header h1::before {
            content: "💬";
            font-size: 1.8rem;
            filter: drop-shadow(0 0 8px rgba(100, 180, 255, 0.6));
        }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(100, 150, 255, 0.2);
            border-radius: 30px;
            padding: 6px 16px;
            border: 1px solid rgba(100, 150, 255, 0.3);
        }

        .user-badge .online-dot {
            width: 10px;
            height: 10px;
            background: #4ade80;
            border-radius: 50%;
            box-shadow: 0 0 12px #4ade80;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                box-shadow: 0 0 8px #4ade80;
            }
            50% {
                box-shadow: 0 0 20px #4ade80, 0 0 30px #4ade80;
            }
        }

        .user-badge span {
            color: #c0d0ff;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .status-text {
            color: #a0b0cc;
            font-size: 0.8rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 12px;
            border-radius: 20px;
            letter-spacing: 0.3px;
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        .messages-area::-webkit-scrollbar {
            width: 6px;
        }
        .messages-area::-webkit-scrollbar-track {
            background: transparent;
        }
        .messages-area::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            animation: fadeInUp 0.3s ease-out;
            word-break: break-word;
        }

        .message.own {
            align-self: flex-end;
        }
        .message.other {
            align-self: flex-start;
        }
        .message.system {
            align-self: center;
            max-width: 90%;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message .bubble {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.4;
            color: #f0f0ff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .message.own .bubble {
            background: linear-gradient(135deg, #4f6ef6, #3b5de7);
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 20px rgba(79, 110, 246, 0.3);
        }

        .message.other .bubble {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-bottom-left-radius: 4px;
        }

        .message.system .bubble {
            background: rgba(255, 200, 100, 0.15);
            border: 1px solid rgba(255, 200, 100, 0.3);
            text-align: center;
            font-style: italic;
            color: #ffd78b;
            font-size: 0.85rem;
            border-radius: 20px;
            padding: 8px 18px;
        }

        .message .meta {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
            padding: 0 8px;
            font-size: 0.75rem;
            color: #a0b0cc;
        }

        .message.own .meta {
            justify-content: flex-end;
        }
        .message.other .meta {
            justify-content: flex-start;
        }

        .message .sender-name {
            font-weight: 600;
            color: #c8d6ff;
        }
        .message.own .sender-name {
            color: #b8c8ff;
        }

        .message .time {
            opacity: 0.7;
            font-size: 0.7rem;
        }

        .input-area {
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.03);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .name-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .name-row input {
            flex: 1;
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            color: #e0e0ff;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s;
        }

        .name-row input:focus {
            border-color: #4f6ef6;
            box-shadow: 0 0 0 3px rgba(79, 110, 246, 0.15);
            background: rgba(255, 255, 255, 0.1);
        }

        .name-row input::placeholder {
            color: #8899bb;
        }

        .save-name-btn {
            padding: 10px 18px;
            background: rgba(100, 150, 255, 0.25);
            border: 1px solid rgba(100, 150, 255, 0.4);
            border-radius: 25px;
            color: #c0d0ff;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.85rem;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .save-name-btn:hover {
            background: rgba(100, 150, 255, 0.4);
            box-shadow: 0 0 15px rgba(79, 110, 246, 0.3);
        }

        .message-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .message-row input {
            flex: 1;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            color: #f0f0ff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s;
        }

        .message-row input:focus {
            border-color: #4f6ef6;
            box-shadow: 0 0 0 3px rgba(79, 110, 246, 0.2);
            background: rgba(255, 255, 255, 0.1);
        }

        .message-row input::placeholder {
            color: #8899bb;
        }

        .send-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4f6ef6, #3b5de7);
            border: none;
            color: white;
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            box-shadow: 0 6px 20px rgba(79, 110, 246, 0.4);
            flex-shrink: 0;
        }

        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(79, 110, 246, 0.6);
        }
        .send-btn:active {
            transform: scale(0.95);
        }
        .send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .empty-chat {
            text-align: center;
            color: #8899bb;
            padding: 40px 20px;
            font-style: italic;
            opacity: 0.7;
        }

        .empty-chat .icon {
            font-size: 3rem;
            margin-bottom: 12px;
            display: block;
            filter: grayscale(0.3);
        }

        @media (max-width: 500px) {
            .chat-container {
                height: 95vh;
                border-radius: 16px;
            }
            .chat-header h1 {
                font-size: 1.2rem;
            }
            .message {
                max-width: 90%;
            }
            .name-row {
                flex-direction: column;
                gap: 6px;
            }
            .save-name-btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>Общий чат</h1>
            <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
                <div class="user-badge">
                    <div class="online-dot"></div>
                    <span id="currentUserNameDisplay">Гость</span>
                </div>
                <div class="status-text" id="connectionStatus">🌐 вкладки синхронизированы</div>
            </div>
        </div>

        <div class="messages-area" id="messagesArea">
            <div class="empty-chat">
                <span class="icon">✨</span>
                Сообщений пока нет.<br>Напишите что-нибудь, и это увидят все открытые вкладки сайта!
            </div>
        </div>

        <div class="input-area">
            <div class="name-row">
                <input type="text" id="nameInput" placeholder="Введите ваше имя..." maxlength="25" autocomplete="off">
                <button class="save-name-btn" id="saveNameBtn">💾 Сохранить имя</button>
            </div>
            <div class="message-row">
                <input type="text" id="messageInput" placeholder="Введите сообщение..." maxlength="500" autocomplete="off">
                <button class="send-btn" id="sendBtn" title="Отправить">➤</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ---------- DOM элементы ----------
            const messagesArea = document.getElementById('messagesArea');
            const nameInput = document.getElementById('nameInput');
            const messageInput = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');
            const saveNameBtn = document.getElementById('saveNameBtn');
            const currentUserNameDisplay = document.getElementById('currentUserNameDisplay');
            const connectionStatus = document.getElementById('connectionStatus');

            // ---------- Константы ----------
            const STORAGE_KEY_NAME = 'globalChatUserName';
            const STORAGE_KEY_MESSAGES = 'globalChatMessages';
            const CHANNEL_NAME = 'global-chat-channel';
            const MAX_STORED_MESSAGES = 150;

            // ---------- Состояние ----------
            let currentUserName = localStorage.getItem(STORAGE_KEY_NAME) || 'Гость';
            let messages = [];
            let channel = null;
            let isSending = false; // флаг чтобы избежать дублирования при получении своего же сообщения через BroadcastChannel

            // ---------- Инициализация BroadcastChannel ----------
            function initChannel() {
                try {
                    channel = new BroadcastChannel(CHANNEL_NAME);
                    channel.onmessage = (event) => {
                        if (event.data && event.data.type === 'chat-message') {
                            const msg = event.data.payload;
                            // Не добавляем, если это сообщение отправили мы сами (проверяем по временной метке и отправителю)
                            // Но проще: все сообщения из канала добавляем, кроме тех, что помечены как локально отправленные.
                            // Используем проверку: если сообщение пришло из канала, и оно не помечено как "уже добавлено локально",
                            // то добавляем. Чтобы избежать дубля, при локальной отправке мы сразу добавляем в messages,
                            // а при получении из канала – проверяем, нет ли уже сообщения с таким же id.
                            const exists = messages.some(m => m.id === msg.id);
                            if (!exists) {
                                addMessageToState(msg);
                                renderMessages();
                                saveMessagesToStorage();
                                scrollToBottom();
                            }
                        } else if (event.data && event.data.type === 'system') {
                            // Можно использовать для системных уведомлений
                            console.log('Системное сообщение из канала:', event.data.payload);
                        }
                    };

                    // Оповещаем другие вкладки, что кто-то подключился (необязательно)
                    channel.postMessage({
                        type: 'system',
                        payload: { text: `Пользователь подключился`, timestamp: Date.now() }
                    });

                    connectionStatus.textContent = '🌐 вкладки синхронизированы';
                    connectionStatus.style.color = '#a0b0cc';
                } catch (e) {
                    channel = null;
                    connectionStatus.textContent = '⚠️ синхронизация между вкладками недоступна';
                    connectionStatus.style.color = '#ffaa66';
                    console.warn('BroadcastChannel не поддерживается или заблокирован. Сообщения будут видны только в этой вкладке.');
                }
            }

            // ---------- Загрузка сообщений из localStorage ----------
            function loadMessagesFromStorage() {
                try {
                    const stored = localStorage.getItem(STORAGE_KEY_MESSAGES);
                    if (stored) {
                        const parsed = JSON.parse(stored);
                        if (Array.isArray(parsed)) {
                            messages = parsed.slice(-MAX_STORED_MESSAGES);
                        }
                    }
                } catch (e) {
                    console.warn('Ошибка загрузки сообщений из localStorage:', e);
                    messages = [];
                }
            }

            // ---------- Сохранение сообщений в localStorage ----------
            function saveMessagesToStorage() {
                try {
                    const toSave = messages.slice(-MAX_STORED_MESSAGES);
                    localStorage.setItem(STORAGE_KEY_MESSAGES, JSON.stringify(toSave));
                } catch (e) {
                    console.warn('Ошибка сохранения сообщений в localStorage:', e);
                }
            }

            // ---------- Добавление сообщения в массив ----------
            function addMessageToState(msg) {
                messages.push(msg);
                // Обрезаем до максимального количества
                if (messages.length > MAX_STORED_MESSAGES) {
                    messages = messages.slice(-MAX_STORED_MESSAGES);
                }
            }

            // ---------- Генерация уникального ID ----------
            function generateMessageId() {
                return 'msg_' + Date.now() + '_' + Math.random().toString(36).substring(2, 9);
            }

            // ---------- Форматирование времени ----------
            function formatTime(timestamp) {
                const date = new Date(timestamp);
                const hours = date.getHours().toString().padStart(2, '0');
                const minutes = date.getMinutes().toString().padStart(2, '0');
                return `${hours}:${minutes}`;
            }

            // ---------- Определение, своё ли сообщение ----------
            function isOwnMessage(senderName) {
                return senderName === currentUserName;
            }

            // ---------- Отрисовка сообщений ----------
            function renderMessages() {
                if (messages.length === 0) {
                    messagesArea.innerHTML = `
                        <div class="empty-chat">
                            <span class="icon">✨</span>
                            Сообщений пока нет.<br>Напишите что-нибудь, и это увидят все открытые вкладки сайта!
                        </div>`;
                    return;
                }

                let html = '';
                messages.forEach(msg => {
                    const isOwn = isOwnMessage(msg.sender);
                    const isSystem = msg.type === 'system';

                    let messageClass = 'other';
                    if (isSystem) messageClass = 'system';
                    else if (isOwn) messageClass = 'own';

                    html += `<div class="message ${messageClass}" data-id="${msg.id}">`;
                    if (!isSystem) {
                        html += `<div class="meta">
                                    <span class="sender-name">${escapeHtml(msg.sender)}</span>
                                    <span class="time">${formatTime(msg.timestamp)}</span>
                                </div>`;
                    }
                    html += `<div class="bubble">${escapeHtml(msg.text)}</div>`;
                    if (isSystem) {
                        html +=
                            `<div class="meta" style="justify-content:center;"><span class="time">${formatTime(msg.timestamp)}</span></div>`;
                    }
                    html += `</div>`;
                });

                messagesArea.innerHTML = html;
            }

            // ---------- Экранирование HTML ----------
            function escapeHtml(text) {
                const map = {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                };
                return String(text).replace(/[&<>"']/g, m => map[m]);
            }

            // ---------- Прокрутка вниз ----------
            function scrollToBottom() {
                requestAnimationFrame(() => {
                    messagesArea.scrollTop = messagesArea.scrollHeight;
                });
            }

            // ---------- Отправка сообщения ----------
            function sendMessage() {
                const text = messageInput.value.trim();
                if (!text) return;

                if (!currentUserName || currentUserName.trim() === '') {
                    alert('Пожалуйста, укажите ваше имя перед отправкой сообщения.');
                    nameInput.focus();
                    return;
                }

                const messageObj = {
                    id: generateMessageId(),
                    sender: currentUserName.trim(),
                    text: text,
                    timestamp: Date.now(),
                    type: 'user'
                };

                // Добавляем локально
                addMessageToState(messageObj);
                renderMessages();
                saveMessagesToStorage();
                scrollToBottom();

                // Отправляем в BroadcastChannel для других вкладок
                if (channel) {
                    try {
                        channel.postMessage({
                            type: 'chat-message',
                            payload: messageObj
                        });
                    } catch (e) {
                        console.warn('Ошибка отправки через BroadcastChannel:', e);
                    }
                }

                // Очищаем поле ввода
                messageInput.value = '';
                messageInput.focus();
            }

            // ---------- Сохранение имени ----------
            function saveUserName() {
                let newName = nameInput.value.trim();
                if (!newName) {
                    alert('Имя не может быть пустым.');
                    nameInput.focus();
                    return;
                }
                if (newName.length > 25) {
                    newName = newName.substring(0, 25);
                }

                const oldName = currentUserName;
                currentUserName = newName;
                localStorage.setItem(STORAGE_KEY_NAME, currentUserName);
                currentUserNameDisplay.textContent = currentUserName;
                nameInput.value = currentUserName;

                // Если имя изменилось, можно добавить системное сообщение
                if (oldName !== currentUserName && oldName !== 'Гость') {
                    const systemMsg = {
                        id: generateMessageId(),
                        sender: 'Система',
                        text: `${escapeHtml(oldName)} сменил(а) имя на ${escapeHtml(currentUserName)}`,
                        timestamp: Date.now(),
                        type: 'system'
                    };
                    addMessageToState(systemMsg);
                    renderMessages();
                    saveMessagesToStorage();
                    scrollToBottom();

                    // Оповещаем другие вкладки о смене имени
                    if (channel) {
                        try {
                            channel.postMessage({
                                type: 'chat-message',
                                payload: systemMsg
                            });
                        } catch (e) {}
                    }
                }
            }

            // ---------- Обработчики событий ----------
            sendBtn.addEventListener('click', sendMessage);
            messageInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            saveNameBtn.addEventListener('click', saveUserName);
            nameInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    saveUserName();
                }
            });

            // ---------- Инициализация при загрузке ----------
            function init() {
                // Устанавливаем имя
                currentUserName = localStorage.getItem(STORAGE_KEY_NAME) || 'Гость';
                if (currentUserName.length > 25) currentUserName = currentUserName.substring(0, 25);
                currentUserNameDisplay.textContent = currentUserName;
                nameInput.value = currentUserName === 'Гость' ? '' : currentUserName;

                // Загружаем сообщения
                loadMessagesFromStorage();

                // Инициализируем канал
                initChannel();

                // Отрисовываем
                renderMessages();
                scrollToBottom();

                // Фокус на поле сообщения
                messageInput.focus();

                // Добавляем системное сообщение о входе (только для этой вкладки, не транслируем чтобы не спамить)
                const welcomeMsg = {
                    id: generateMessageId(),
                    sender: 'Система',
                    text: `Добро пожаловать, ${escapeHtml(currentUserName)}! Все открытые вкладки видят сообщения этого чата.`,
                    timestamp: Date.now(),
                    type: 'system'
                };
                // Не добавляем автоматически, чтобы не засорять историю. Можно добавить, если нужно.
                // Но лучше показать однократно в консоли или в интерфейсе? 
                // Покажем как первое системное сообщение при пустом чате.
                if (messages.length === 0) {
                    addMessageToState(welcomeMsg);
                    renderMessages();
                    saveMessagesToStorage();
                    scrollToBottom();
                }

                // Слушаем изменения localStorage из других вкладок (дополнительная синхронизация на случай, если BroadcastChannel не сработал)
                window.addEventListener('storage', (e) => {
                    if (e.key === STORAGE_KEY_MESSAGES && e.newValue) {
                        try {
                            const newMessages = JSON.parse(e.newValue);
                            if (Array.isArray(newMessages)) {
                                // Сравниваем длины и последние id, чтобы не перезаписывать без нужды
                                const currentIds = new Set(messages.map(m => m.id));
                                let hasNew = false;
                                const updatedMessages = [...messages];
                                newMessages.forEach(msg => {
                                    if (!currentIds.has(msg.id)) {
                                        updatedMessages.push(msg);
                                        hasNew = true;
                                    }
                                });
                                if (hasNew) {
                                    messages = updatedMessages.slice(-MAX_STORED_MESSAGES);
                                    renderMessages();
                                    scrollToBottom();
                                }
                            }
                        } catch (err) {}
                    }
                    if (e.key === STORAGE_KEY_NAME && e.newValue) {
                        // Имя обновилось в другой вкладке — можно обновить отображение, но свое имя не меняем
                        // Просто для информации
                    }
                });
            }

            // Запуск
            init();

            // Автофокус на поле сообщения при клике в любом месте (удобство)
            document.addEventListener('click', (e) => {
                if (!e.target.closest('input') && !e.target.closest('button') && !e.target.closest(
                        '.messages-area')) {
                    messageInput.focus();
                }
            });

            console.log('🌍 Общий чат запущен. Все открытые вкладки этого сайта видят сообщения друг друга.');
            console.log('💡 Технология: BroadcastChannel API + localStorage для хранения истории.');
