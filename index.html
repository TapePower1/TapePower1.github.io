<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шашки — расширенная версия</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #2d2d2d;
            color: #f0d9b5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
            padding: 20px;
        }

        .game-container {
            background: #1e1e1e;
            padding: 20px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            align-items: flex-start;
            justify-content: center;
        }

        .board-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #checkersBoard {
            display: grid;
            grid-template-columns: repeat(8, 80px);
            grid-template-rows: repeat(8, 80px);
            border: 4px solid #b58863;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .square {
            width: 80px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .dark-sq {
            background-color: #b58863;
        }

        .light-sq {
            background-color: #f0d9b5;
        }

        .selected-cell {
            box-shadow: inset 0 0 0 4px #ffeb3b;
            z-index: 2;
        }

        .highlight-move {
            box-shadow: inset 0 0 0 4px #4caf50;
            cursor: pointer;
        }

        .piece {
            width: 70%;
            height: 70%;
            border-radius: 50%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }

        .white-piece {
            background: radial-gradient(circle at 40% 40%, #ffffff, #cccccc);
        }

        .black-piece {
            background: radial-gradient(circle at 40% 40%, #555555, #111111);
        }

        .king {
            position: relative;
        }

        .king::after {
            content: "♛";
            font-size: 32px;
            color: gold;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-shadow: 0 0 6px black;
        }

        .info-panel {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 12px;
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        #checkersStatus {
            font-weight: bold;
            font-size: 1.1em;
            background: #3d3d3d;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }

        .timer {
            font-size: 1.4em;
            background: #3d3d3d;
            padding: 8px;
            border-radius: 8px;
            text-align: center;
            font-family: monospace;
        }

        .move-history-title, .game-history-title {
            font-weight: bold;
            margin-top: 5px;
        }

        #moveHistoryList {
            background: #3d3d3d;
            border-radius: 8px;
            padding: 8px;
            max-height: 150px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.9em;
            list-style: none;
        }

        #moveHistoryList li {
            padding: 2px 0;
            border-bottom: 1px solid #555;
        }

        #gameHistoryList {
            background: #3d3d3d;
            border-radius: 8px;
            padding: 8px;
            max-height: 200px;
            overflow-y: auto;
            font-size: 0.85em;
            margin-bottom: 10px;
        }

        .game-entry {
            padding: 5px;
            border-bottom: 1px solid #555;
            cursor: pointer;
        }

        .game-entry:hover {
            background: #4a4a4a;
        }

        button {
            background: #b58863;
            color: #1e1e1e;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.95em;
        }

        button:hover {
            background: #c69c6d;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: #2d2d2d;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 0 30px black;
        }

        .modal-content h3 {
            margin-bottom: 20px;
        }

        .time-options {
            margin: 15px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-start;
        }

        .time-options label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="board-section">
        <div id="checkersBoard"></div>
        <div style="display: flex; gap: 10px;">
            <button id="resetCheckers">Новая игра</button>
            <button id="clearHistoryBtn">Очистить историю партий</button>
        </div>
    </div>
    <div class="info-panel">
        <div id="checkersStatus">Ход белых</div>
        <div class="timer" id="timerDisplay">--:--</div>
        <div class="move-history-title">История ходов</div>
        <ol id="moveHistoryList"></ol>
        <div class="game-history-title">История партий</div>
        <div id="gameHistoryList"></div>
    </div>
</div>

<!-- Модальное окно выбора времени -->
<div id="timeModal" class="modal">
    <div class="modal-content">
        <h3>Настройка времени на ход</h3>
        <div class="time-options">
            <label><input type="radio" name="timeControl" value="0" checked> Без ограничений</label>
            <label><input type="radio" name="timeControl" value="60"> 1 минута</label>
            <label><input type="radio" name="timeControl" value="120"> 2 минуты</label>
            <label><input type="radio" name="timeControl" value="300"> 5 минут</label>
        </div>
        <button id="startGameBtn">Начать игру</button>
    </div>
</div>

<script>
    (function() {
        // ---------- Глобальные переменные игры ----------
        let checkersBoard = [],
            selectedCell = null,
            currentTurn = 'white',
            forcedCapture = false;
        let highlightMoves = [];

        // ---------- Таймер ----------
        let timerInterval = null;
        let timeLeft = 0;               // секунд для текущего игрока
        let timeControl = 0;           // 0 = без ограничений, иначе секунды на ход
        let timerActive = false;

        // ---------- История ходов текущей партии ----------
        let moveHistory = [];           // массив строк вида "a3-b4" или "c5:e3"
        let currentMoveSequence = [];   // накопитель клеток для серии взятий

        // ---------- История партий (localStorage) ----------
        const STORAGE_KEY = 'checkersGameHistory';

        // ---------- Вспомогательные функции координат ----------
        function colToLetter(col) {
            return String.fromCharCode(97 + col); // 0->a, 7->h
        }

        function rowToNumber(row) {
            return 8 - row;   // row 7 -> 1, row 0 -> 8
        }

        function cellName(row, col) {
            return colToLetter(col) + rowToNumber(row);
        }

        // ---------- Управление историей партий (localStorage) ----------
        function loadGameHistory() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch (e) {
                return [];
            }
        }

        function saveGameHistory(history) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
            } catch (e) {
                // localStorage переполнен или недоступен
            }
        }

        function addGameToHistory(winner, moves, timeControlUsed) {
            const history = loadGameHistory();
            history.push({
                date: new Date().toLocaleString(),
                winner: winner === 'white' ? 'Белые' : 'Чёрные',
                moves: moves.slice(),
                timeControl: timeControlUsed
            });
            saveGameHistory(history);
            renderGameHistory();
        }

        function clearGameHistory() {
            try {
                localStorage.removeItem(STORAGE_KEY);
            } catch (e) {}
            renderGameHistory();
        }

        function renderGameHistory() {
            const container = document.getElementById('gameHistoryList');
            const history = loadGameHistory();
            container.innerHTML = '';
            if (history.length === 0) {
                container.innerHTML = '<div style="padding:5px;">Нет сохранённых партий</div>';
                return;
            }
            history.slice().reverse().forEach((game, idx) => {
                const div = document.createElement('div');
                div.className = 'game-entry';
                div.textContent = `${game.date} — Победитель: ${game.winner} (время: ${game.timeControl === 0 ? 'без ограничений' : game.timeControl + ' сек'})`;
                div.title = 'Ходы: ' + game.moves.join(', ');
                container.appendChild(div);
            });
        }

        // ---------- Управление историей ходов текущей партии ----------
        function resetMoveHistory() {
            moveHistory = [];
            currentMoveSequence = [];
            document.getElementById('moveHistoryList').innerHTML = '';
        }

        function addMoveToHistory(moveStr) {
            moveHistory.push(moveStr);
            const list = document.getElementById('moveHistoryList');
            const li = document.createElement('li');
            li.textContent = moveStr;
            list.appendChild(li);
            list.scrollTop = list.scrollHeight;
        }

        // Завершение серии ходов (после того, как игрок закончил все обязательные взятия)
        function finalizeCurrentMove() {
            if (currentMoveSequence.length >= 2) {
                // Собираем строку: начальная клетка, затем разделители '-' для тихого хода, ':' для взятия
                // Но у нас в последовательности все ходы либо все тихие, либо все взятия (смешанных не бывает)
                const isCapture = (currentMoveSequence.length > 2) || 
                                  (moveHistory.length > 0 && moveHistory[moveHistory.length-1].includes(':'));
                // Определим по контексту: если последовательность из двух клеток и между ними было взятие? 
                // Проще: если в highlightMoves первого хода был capture?
                // Мы можем сохранять тип хода в момент executeMove. Но чтобы не усложнять, используем факт:
                // Если длина >2, значит было хотя бы одно взятие (серия). В одиночном ходе тоже может быть взятие.
                // Будем использовать флаг isCapture из executeMove, переданный через замыкание. Переделаем.
                const separator = isCapture ? ':' : '-';
                const moveStr = currentMoveSequence.join(separator);
                addMoveToHistory(moveStr);
            } else if (currentMoveSequence.length === 2) {
                addMoveToHistory(currentMoveSequence.join('-'));
            }
            currentMoveSequence = [];
        }

        // ---------- Таймер ----------
        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            timerActive = false;
        }

        function updateTimerDisplay() {
            const el = document.getElementById('timerDisplay');
            if (timeControl === 0) {
                el.textContent = '--:--';
                return;
            }
            const mins = Math.floor(Math.max(0, timeLeft) / 60);
            const secs = Math.floor(Math.max(0, timeLeft) % 60);
            el.textContent = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
            if (timeLeft <= 0) {
                el.style.color = '#ff5555';
            } else {
                el.style.color = '#f0d9b5';
            }
        }

        function startTimer() {
            if (timeControl === 0) {
                updateTimerDisplay();
                return;
            }
            stopTimer();
            timerActive = true;
            timeLeft = timeControl; // сброс на полное время для текущего игрока
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateTimerDisplay();
                }
                if (timeLeft <= 0) {
                    // Время вышло
                    stopTimer();
                    timerActive = false;
                    document.getElementById('checkersStatus').textContent =
                        `Время вышло! Ход ${currentTurn === 'white' ? 'белых' : 'чёрных'}. Сделайте ход.`;
                    alert(`Время на ход истекло! Сейчас ход ${currentTurn === 'white' ? 'белых' : 'чёрных'}.`);
                    updateTimerDisplay();
                }
            }, 1000);
        }

        function resetTimerForNewTurn() {
            stopTimer();
            if (timeControl > 0) {
                timeLeft = timeControl;
                updateTimerDisplay();
                startTimer();
            } else {
                updateTimerDisplay();
            }
        }

        // ---------- Оригинальные функции игры (без изменений в логике) ----------
        function removeCapturedPiece(fromRow, fromCol, toRow, toCol) {
            const dr = Math.sign(toRow - fromRow);
            const dc = Math.sign(toCol - fromCol);
            let r = fromRow + dr;
            let c = fromCol + dc;
            const opponent = currentTurn === 'white' ? 'black' : 'white';
            while (r !== toRow || c !== toCol) {
                if (checkersBoard[r][c] && checkersBoard[r][c].startsWith(opponent)) {
                    checkersBoard[r][c] = null;
                    return;
                }
                r += dr;
                c += dc;
            }
        }

        function setupBoard() {
            checkersBoard = [];
            for (let r = 0; r < 8; r++) {
                checkersBoard[r] = [];
                for (let c = 0; c < 8; c++) {
                    if ((r + c) % 2 === 1) {
                        if (r < 3) checkersBoard[r][c] = 'black';
                        else if (r > 4) checkersBoard[r][c] = 'white';
                        else checkersBoard[r][c] = null;
                    } else checkersBoard[r][c] = null;
                }
            }
            currentTurn = 'white';
            selectedCell = null;
            forcedCapture = false;
            highlightMoves = [];
            checkForcedCapture();
            drawBoard();
            document.getElementById('checkersStatus').textContent = 'Ход белых';
            resetMoveHistory();
            stopTimer();
            timerActive = false;
            resetTimerForNewTurn(); // запустит таймер для белых
        }

        function drawBoard() {
            const container = document.getElementById('checkersBoard');
            container.innerHTML = '';
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const sq = document.createElement('div');
                    sq.className = `square ${(r + c) % 2 === 0 ? 'light-sq' : 'dark-sq'}`;
                    sq.dataset.row = r;
                    sq.dataset.col = c;
                    if (selectedCell && r === selectedCell.row && c === selectedCell.col) {
                        sq.classList.add('selected-cell');
                    }
                    if (highlightMoves.some(m => m.row === r && m.col === c)) {
                        sq.classList.add('highlight-move');
                    }
                    const piece = checkersBoard[r][c];
                    if (piece) {
                        const pieceEl = document.createElement('div');
                        const isKing = piece.endsWith('_king');
                        const pieceColor = piece.startsWith('white') ? 'white' : 'black';
                        pieceEl.className = `piece ${pieceColor}-piece`;
                        if (isKing) pieceEl.classList.add('king');
                        sq.appendChild(pieceEl);
                    }
                    sq.addEventListener('click', () => onSquareClick(r, c));
                    container.appendChild(sq);
                }
            }
        }

        function checkForcedCapture() {
            forcedCapture = false;
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if (checkersBoard[r][c] && checkersBoard[r][c].startsWith(currentTurn)) {
                        if (canCaptureFrom(r, c)) {
                            forcedCapture = true;
                            return;
                        }
                    }
                }
            }
        }

        function canCaptureFrom(row, col) {
            const piece = checkersBoard[row][col];
            if (!piece) return false;
            const moves = getValidMoves(row, col);
            return moves.some(m => m.capture);
        }

        function onSquareClick(row, col) {
            // Если уже выбрана фигура для продолжения взятия
            if (selectedCell) {
                if (selectedCell.row === row && selectedCell.col === col) {
                    if (!forcedCapture) {
                        selectedCell = null;
                        highlightMoves = [];
                        drawBoard();
                    }
                    return;
                }
                if (highlightMoves.some(m => m.row === row && m.col === col)) {
                    const targetMove = highlightMoves.find(m => m.row === row && m.col === col);
                    if (targetMove) {
                        executeMove(row, col, targetMove.capture);
                    }
                    return;
                }
                return;
            }

            // Выбор своей фигуры
            if (checkersBoard[row][col] && checkersBoard[row][col].startsWith(currentTurn)) {
                if (forcedCapture && !canCaptureFrom(row, col)) {
                    return;
                }
                const moves = getValidMoves(row, col);
                if (moves.length > 0) {
                    selectedCell = { row, col };
                    highlightMoves = forcedCapture ?
                        moves.filter(m => m.capture).map(m => ({ row: m.toRow, col: m.toCol, capture: true })) :
                        moves.map(m => ({ row: m.toRow, col: m.toCol, capture: m.capture }));
                } else {
                    selectedCell = null;
                    highlightMoves = [];
                }
                drawBoard();
            }
        }

        function executeMove(toRow, toCol, isCapture) {
            const piece = checkersBoard[selectedCell.row][selectedCell.col];
            checkersBoard[toRow][toCol] = piece;
            checkersBoard[selectedCell.row][selectedCell.col] = null;
            if (piece === 'white' && toRow === 0) checkersBoard[toRow][toCol] = 'white_king';
            else if (piece === 'black' && toRow === 7) checkersBoard[toRow][toCol] = 'black_king';
            if (isCapture) {
                removeCapturedPiece(selectedCell.row, selectedCell.col, toRow, toCol);
            }

            // Начинаем формировать запись хода
            const fromCell = cellName(selectedCell.row, selectedCell.col);
            const toCell = cellName(toRow, toCol);

            // Если это первый шаг в серии, инициализируем currentMoveSequence
            if (currentMoveSequence.length === 0) {
                currentMoveSequence.push(fromCell);
            }
            currentMoveSequence.push(toCell);

            selectedCell = null;
            highlightMoves = [];
            drawBoard();

            // Продолжение взятия только если предыдущий ход был взятием
            if (isCapture) {
                const newMoves = getValidMoves(toRow, toCol).filter(m => m.capture);
                if (newMoves.length > 0) {
                    selectedCell = { row: toRow, col: toCol };
                    highlightMoves = newMoves.map(m => ({ row: m.toRow, col: m.toCol, capture: true }));
                    drawBoard();
                    document.getElementById('checkersStatus').textContent =
                        `${currentTurn === 'white' ? 'Белые' : 'Чёрные'} бьют дальше`;
                    // Таймер не переключаем, ждём завершения серии
                    return;
                }
            }

            // Завершение хода (серия закончена или одиночный ход)
            // Определим, был ли этот ход взятием, для правильного разделителя в истории
            // Мы уже имеем isCapture, но он относится к последнему шагу. Если серия, то все шаги взятия.
            // Передадим в finalizeCurrentMove флаг, что это capture-ход.
            // Проще: если currentMoveSequence.length > 2 или isCapture === true, используем ':'
            const moveWasCapture = isCapture || currentMoveSequence.length > 2;
            const separator = moveWasCapture ? ':' : '-';
            const moveStr = currentMoveSequence.join(separator);
            addMoveToHistory(moveStr);
            currentMoveSequence = [];

            // Смена игрока
            currentTurn = currentTurn === 'white' ? 'black' : 'white';
            checkForcedCapture();
            document.getElementById('checkersStatus').textContent =
                `Ход ${currentTurn === 'white' ? 'белых' : 'чёрных'}` +
                (forcedCapture ? ' (должны взять!)' : '');

            // Таймер для нового игрока
            resetTimerForNewTurn();

            drawBoard();
            if (!hasAnyMoves(currentTurn)) {
                const winner = currentTurn === 'white' ? 'black' : 'white';
                document.getElementById('checkersStatus').textContent =
                    `Победа ${winner === 'white' ? 'белых' : 'чёрных'}!`;
                stopTimer();
                timerActive = false;
                updateTimerDisplay();
                addGameToHistory(winner, moveHistory, timeControl);
            }
        }

        function getValidMoves(row, col) {
            const piece = checkersBoard[row][col];
            if (!piece) return [];
            const isKing = piece.endsWith('_king');
            const isWhite = piece.startsWith('white');
            const opponent = isWhite ? 'black' : 'white';
            const moves = [];
            const captureMoves = [];
            const directions = [-1, 1];
            const range = isKing ? 7 : 1;
            for (let dr of directions) {
                for (let dc of directions) {
                    for (let step = 1; step <= range; step++) {
                        const nr = row + dr * step;
                        const nc = col + dc * step;
                        if (nr < 0 || nr > 7 || nc < 0 || nc > 7) break;
                        const target = checkersBoard[nr]?.[nc];
                        if (target === null) {
                            if (!isKing && ((isWhite && dr !== -1) || (!isWhite && dr !== 1))) continue;
                            moves.push({ toRow: nr, toCol: nc, capture: false });
                        } else if (target.startsWith(opponent)) {
                            const jr = nr + dr;
                            const jc = nc + dc;
                            if (jr >= 0 && jr <= 7 && jc >= 0 && jc <= 7 && checkersBoard[jr][jc] === null) {
                                captureMoves.push({ toRow: jr, toCol: jc, capture: true });
                            }
                            break;
                        } else {
                            break;
                        }
                    }
                }
            }
            return captureMoves.length > 0 ? captureMoves : moves;
        }

        function hasAnyMoves(player) {
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if (checkersBoard[r][c] && checkersBoard[r][c].startsWith(player)) {
                        if (getValidMoves(r, c).length > 0) return true;
                    }
                }
            }
            return false;
        }

        function resetCheckers() {
            // Показываем диалог выбора времени, после подтверждения запускаем игру
            showTimeModal((selectedTime) => {
                timeControl = selectedTime;
                setupBoard();
                checkForcedCapture();
                drawBoard();
                document.getElementById('checkersStatus').textContent = 'Ход белых';
                resetTimerForNewTurn();
            });
        }

        // ---------- Модальное окно выбора времени ----------
        function showTimeModal(callback) {
            const modal = document.getElementById('timeModal');
            modal.style.display = 'flex';
            const startBtn = document.getElementById('startGameBtn');
            const radioName = 'timeControl';
            
            function onStart() {
                const selected = document.querySelector(`input[name="${radioName}"]:checked`);
                const value = selected ? parseInt(selected.value, 10) : 0;
                modal.style.display = 'none';
                startBtn.removeEventListener('click', onStart);
                callback(value);
            }

            startBtn.addEventListener('click', onStart);
        }

        // ---------- Инициализация кнопок и событий ----------
        function initCheckers() {
            document.getElementById('resetCheckers').addEventListener('click', resetCheckers);
            document.getElementById('clearHistoryBtn').addEventListener('click', () => {
                if (confirm('Удалить всю историю партий?')) {
                    clearGameHistory();
                }
            });

            // При первой загрузке предлагаем выбрать время и запустить игру
            showTimeModal((selectedTime) => {
                timeControl = selectedTime;
                setupBoard();
                resetTimerForNewTurn();
            });

            renderGameHistory();
        }

        // Старт
        window.addEventListener('DOMContentLoaded', initCheckers);
    })();
</script>
</body>
</html>
