<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Игра Змейка</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #222;
      color: white;
      font-family: Arial, sans-serif;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 24px;
    }

    canvas {
      border: 2px solid #fff;
      background-color: #000;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
    }

    p {
      color: #aaa;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h1>Змейка</h1>
  <canvas width="400" height="400" id="game"></canvas>
  <p>Управление: стрелки на клавиатуре</p>

  <script>
    const canvas = document.getElementById('game');
    const context = canvas.getContext('2d');

    // Размер одной клетки на поле
    const grid = 16;
    let count = 0;

    let snake = {
      x: 160,
      y: 160,
      dx: grid, // скорость по X
      dy: 0,    // скорость по Y
      cells: [],
      maxCells: 4
    };

    let apple = {
      x: 320,
      y: 320
    };

    // Функция для генерации случайных координат яблока
    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min)) + min;
    }

    // Главный игровой цикл
    function loop() {
      requestAnimationFrame(loop);

      // Игровой цикл выполняется со скоростью 60 кадров в секунду.
      // Замедляем игру до 10 кадров в секунду
      if (++count < 6) {
        return;
      }
      count = 0;

      context.clearRect(0, 0, canvas.width, canvas.height);

      // Двигаем змейку с нужной скоростью
      snake.x += snake.dx;
      snake.y += snake.dy;

      // Прохождение сквозь края экрана
      if (snake.x < 0) {
        snake.x = canvas.width - grid;
      } else if (snake.x >= canvas.width) {
        snake.x = 0;
      }
      
      if (snake.y < 0) {
        snake.y = canvas.height - grid;
      } else if (snake.y >= canvas.height) {
        snake.y = 0;
      }

      // Добавляем новые координаты головы в начало массива
      snake.cells.unshift({ x: snake.x, y: snake.y });

      // Удаляем последние элементы массива, если длина змейки превысила максимальную
      if (snake.cells.length > snake.maxCells) {
        snake.cells.pop();
      }

      // Рисуем яблоко
      context.fillStyle = 'red';
      context.fillRect(apple.x, apple.y, grid - 1, grid - 1);

      // Рисуем змейку
      context.fillStyle = 'green';
      snake.cells.forEach(function(cell, index) {
        context.fillRect(cell.x, cell.y, grid - 1, grid - 1);

        // Проверка: змейка съела яблоко
        if (cell.x === apple.x && cell.y === apple.y) {
          snake.maxCells++;
          // Генерируем новое яблоко (размер поля 400x400 / 16 = 25 клеток)
          apple.x = getRandomInt(0, 25) * grid;
          apple.y = getRandomInt(0, 25) * grid;
        }

        // Проверка: змейка столкнулась сама с собой
        for (let i = index + 1; i < snake.cells.length; i++) {
          if (cell.x === snake.cells[i].x && cell.y === snake.cells[i].y) {
            // Сбрасываем параметры игры
            snake.x = 160;
            snake.y = 160;
            snake.cells = [];
            snake.maxCells = 4;
            snake.dx = grid;
            snake.dy = 0;
            apple.x = getRandomInt(0, 25) * grid;
            apple.y = getRandomInt(0, 25) * grid;
          }
        }
      });
    }

    // Слушаем события клавиатуры для управления
    document.addEventListener('keydown', function(e) {
      // Исключаем разворот на 180 градусов
      // Стрелка влево
      if (e.which === 37 && snake.dx === 0) {
        snake.dx = -grid;
        snake.dy = 0;
      }
      // Стрелка вверх
      else if (e.which === 38 && snake.dy === 0) {
        snake.dy = -grid;
        snake.dx = 0;
      }
      // Стрелка вправо
      else if (e.which === 39 && snake.dx === 0) {
        snake.dx = grid;
        snake.dy = 0;
      }
      // Стрелка вниз
      else if (e.which === 40 && snake.dy === 0) {
        snake.dy = grid;
        snake.dx = 0;
      }
    });

    // Запускаем игру
    requestAnimationFrame(loop);
  </script>
</body>
</html>
